# compose/seal/compose.yaml — vault-s (OSS Shamir seal node) + seal identity.
#
# Single-node Raft, Shamir seal (1-of-1). vault-1 unseals through its
# `autounseal` Transit key. Cold start order is handled by `make vault-up`
# / `make seal-up`; this node must be unsealed before vault-1 can start.

services:
  vault-s:
    image: ${VAULT_IMAGE}
    container_name: krot-vault-s
    hostname: vault-s
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/config/tls/ca-chain.pem
    entrypoint: ["/bin/sh", "/krot/vault-server.sh"]
    ports: ["127.0.0.1:${KROT_PORT_VAULT_S}:8200"]
    volumes:
      - vault-s-data:/vault/file        # persistent: Raft data + Transit key
      - vault-s-audit:/vault/audit      # persistent: audit log
      - ../../vault/vault-s/config.hcl:/vault/config/config.hcl:ro
      - ../../vault-tls:/vault/config/tls:ro
      - ../../scripts/vault-server.sh:/krot/vault-server.sh:ro
    restart: unless-stopped
    mem_limit: 512m
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "S=$$(wget -S -qO/dev/null --no-check-certificate 'https://127.0.0.1:8200/v1/sys/health' 2>&1 | awk '/^ *HTTP\\//{print $$2; exit}'); [ -n \"$$S\" ]"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # One-shot: chown named volumes to uid 100:1000 (rotator / agent).
  volume-init:
    image: ${ALPINE_IMAGE}
    container_name: krot-seal-volume-init
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c", "chown 100:1000 /sink /approle && chmod 750 /sink && chmod 700 /approle && echo '[volume-init] done'"]
    volumes:
      - seal-token:/sink
      - approle-seal:/approle
    restart: "no"

  seal-rotator:
    image: ${VAULT_IMAGE}
    container_name: krot-seal-rotator
    hostname: seal-rotator
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/bin/sh", "/vault/rotator/rotator.sh"]
    environment:
      VAULT_ADDR: https://vault-s:8200
      VAULT_CACERT: /vault/tls/ca-chain.pem
      TARGET_ROLES: krot-seal-autounseal
      ROTATOR_CREDS_DIR: /run/rotator
      CHECK_INTERVAL_SECONDS: "60"
      ROTATE_BELOW_FRACTION: "3"
      WARN_IF_SHORTER_THAN: "7776000"
    volumes:
      - ../../vault-tls/ca-chain.pem:/vault/tls/ca-chain.pem:ro
      - ../common/rotator:/vault/rotator:ro
      - ../../.secrets/vault/seal-rotator:/run/rotator:ro     # human-delivered credential
      - approle-seal:/run/approle                             # persistent: current secret-id
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /vault/rotator/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  seal-agent:
    image: ${VAULT_IMAGE}
    container_name: krot-seal-agent
    hostname: seal-agent
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/bin/sh", "/vault/agent/entrypoint.sh"]
    environment:
      AGENT_NAME: krot-seal-autounseal
      APPROLE_DIR: /run/approle/krot-seal-autounseal
      TOKEN_FILE: /vault/secrets/transit-token
      VAULT_ADDR: https://vault-s:8200
      VAULT_CACERT: /vault/tls/ca-chain.pem
    volumes:
      - ../../vault-tls/ca-chain.pem:/vault/tls/ca-chain.pem:ro
      - ../common/agent/entrypoint.sh:/vault/agent/entrypoint.sh:ro
      - ./agent/config.hcl:/vault/agent/config.hcl:ro
      - approle-seal:/run/approle:ro     # written by the seal rotator
      - seal-token:/vault/secrets        # shared with the vault stack
    networks: [default]
    restart: on-failure
    depends_on:
      seal-rotator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/secrets/transit-token && VAULT_TOKEN=$$(cat /vault/secrets/transit-token) vault token lookup >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  default:
    name: krot-internal
    external: true

volumes:
  vault-s-data:
    labels: { io.krot.data: "true" }
  vault-s-audit:
    labels: { io.krot.data: "true" }
  approle-seal:
    labels: { io.krot.data: "true" }
  seal-token: {}
