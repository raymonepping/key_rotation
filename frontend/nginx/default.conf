server {
  listen      8443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/tls/web.crt;
  ssl_certificate_key /etc/nginx/tls/web.key;
  ssl_protocols       TLSv1.3 TLSv1.2;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  root  /usr/share/nginx/html;
  index index.html;

  # React SPA: serve index.html for any path nginx does not recognise.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /api to booklib backend.
  location /api/ {
    proxy_pass         http://booklib:3001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_pass_request_headers on;
  }

  # /health and /protected proxied directly to booklib.
  location ~ ^/(health|protected)$ {
    proxy_pass         http://booklib:3001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_pass_request_headers on;
  }
}
